const notes={cloud:'F01–F13｜选择左侧游戏联动历史和详情；点击版本才更新右侧。备注行内保存，锁定就地反馈。备份不弹成功窗；恢复先检查环境，再一次确认。',market:'F18–F22｜保存只加入我的存档，不修改本地。应用才进入恢复检查。失效内容保留原因但禁用应用，专辑逐条保存。',saved:'F23–F24｜收藏夹与中转站分开；“应用到游戏”会进入覆盖确认。“删除记录”只移除演示引用，不删除游戏存档。',tasks:'O04–O06｜任务按阶段记录；重试前复查。恢复安全备份失败必须停止；回滚未完成持续提示，不显示恢复成功。',settings:'F25–F28｜账号切换后重新加载账号域数据；配额按账号×游戏是演示规则，待确认。缓存仅模拟可重下文件，不清理唯一存档。',diagnostics:'F29–F31｜指定故障发生设备；日志默认不授权。反馈只模拟返回编号，不上传系统信息或个人资料。',add:'F03–F05｜先看适配状态和目录检测，再添加。未适配项禁用，路径错误紧贴字段，不串联多个弹窗。',publish:'F21｜选择当前游戏云端版本，填写标题说明，最多3个标签；提交展示模拟待审核，不假装已发布到线上。',safe:'F14｜恢复前安全备份关联恢复任务；还原也经过环境检查与覆盖确认，不是一键无保护回退。'};
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',2800)}
function modal(title,body,actions){$('#modal-root').innerHTML=`<div class="scrim"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1"><h2>${title}</h2>${body}<div class="actions">${actions}</div></section></div>`;$('.modal').focus()}
function closeModal(){$('#modal-root').innerHTML=''}
function heading(title,sub='',actions=''){return `<div class="page-heading"><div><div class="eyebrow">LEIGOD / CLOUD SAVE</div><h1>${title}</h1><small>${sub}</small></div><div class="actions">${actions}</div></div>`}
function sidebar(){$('#sidebar').innerHTML=`<div class="account"><div class="avatar">${state.account}</div><div><strong>演示账号 ${state.account}</strong><small>平台绑定：Steam · DEMO-${state.account}</small></div>${button('⇄','account')}</div><div class="search-row"><input aria-label="搜索游戏" id="game-search" placeholder="搜索我的游戏" value="${esc(state.search)}">${button('＋','add','secondary')}</div><div class="games">${games.filter(g=>g.name.toLowerCase().includes(state.search.toLowerCase())).map(g=>`<button class="game ${g.id===state.game?'selected':''}" data-game="${g.id}"><img src="${image(g)}" alt=""><div class="game-info"><strong>${g.name}</strong><small>${g.id===state.game?statusLabel():g.note}</small></div><span class="status" title="${g.id===state.game?statusLabel():'查看历史存档'}">${g.id===state.game&&state.scenario!=='normal'?'!':'✓'}</span></button>`).join('')}</div><div class="aside-bottom">${button('我的存档','saved')}${button('诊断反馈','diagnostics')}</div>`}
function statusLabel(){if(state.busy)return state.phase+' '+state.progress+'%';return ({normal:'同步时间：今天 15:40',empty:'未检测到本地存档',account:'账号不匹配 · 暂停同步',running:'游戏运行中',network:'网络中断演示',safety:'安全备份失败演示',rollback:'回滚失败演示',conflict:'本地与云端不一致'})[state.scenario]}
function render(){sidebar();document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===state.nav));$('#task-count').textContent=state.tasks.length;$('#review-panel').style.display=state.notes?'block':'none';$('#interaction-note').textContent=notes[state.nav]||notes.cloud;$('#scenario').value=state.scenario;const fn={cloud:cloud,market:market,saved:saved,tasks:tasks,settings:settings,diagnostics:diagnostics,add:add,publish:publish,safe:safe};$('#content').innerHTML=(fn[state.nav]||cloud)()}
function statusBox(){if(state.busy)return `<div class="status-box"><b>${state.phase} · ${state.progress}%</b><div class="progress"><span style="width:${state.progress}%"></span></div><p>可切换页面浏览；当前游戏写操作暂不可重复提交。</p></div>`;if(state.result)return `<div class="status-box ${state.result.error?'error':'success'}"><b>${state.result.title}</b><p>${state.result.body}</p>${state.result.error?button('查看诊断','diagnostics'):''}</div>`;const cases={empty:['未检测到本地存档','请先进入游戏创建一次存档，再退出游戏重新检测。已有存档请检查目录。','重新检测','detect'],account:['账号不匹配','当前Steam登录账号与绑定账号不同，不是登录超时。暂停备份与恢复。','核对并切换账号','settings'],running:['游戏运行中','请退出游戏再恢复，避免文件被占用或退出时覆盖。','已退出，重新检测','detect'],conflict:['本地与云端不一致','不自动用更新时间判定正确版本，请先比较再处理。','查看版本差异','conflict']};const c=cases[state.scenario];return c?`<div class="status-box ${state.scenario==='account'?'error':''}"><b>${c[0]}</b><p>${c[1]}</p>${button(c[2],c[3])}</div>`:''}
function cloud(){const g=selectedGame(),v=version(),list=versions();return heading(g.name,'云存档 / 当前绑定账号：DEMO-'+state.account,button('恢复前备份','safe')+button('立即备份','backup','secondary',state.busy))+`<div class="split"><div><div class="history"><div class="history-head"><strong>历史存档 <span class="muted">（${list.filter(v=>!v.locked).length}/10）</span></strong><small>普通版本保留10个 · 锁定独立 ${list.filter(v=>v.locked).length}/5 <span title="演示口径，待产品确认">ⓘ</span></small></div>${list.map((r,i)=>`<div class="version ${r.id===v.id?'selected':''}" data-version="${r.id}" tabindex="0" role="button"><span class="muted">${String(i+1).padStart(2,'0')}</span><div class="version-name"><strong>${esc(r.title)}</strong><small>${r.time} · ${r.source}</small></div><button class="lock" data-lock="${r.id}" title="${r.locked?'解除锁定':'锁定存档'}">${r.locked?'◆':'◇'}</button></div>`).join('')}</div><p class="note-link">锁定存档不会参与普通版本轮转 · 额度口径待确认</p></div><div class="details-panel"><div class="preview"><img src="${image(g)}" alt="${g.name}示意素材"><div class="preview-label">${g.name}</div></div><div class="details"><div class="kv"><span>上传设备</span><b>${v.device}</b></div><div class="kv"><span>文件大小</span><b>${v.size}</b></div><div class="kv"><span>存档时间</span><b>${v.time}</b></div><div class="kv"><span>存档来源</span><b>${v.source==='广场来源'?'<button data-action="market" style="padding:0;color:#afcaff">存档广场 ↗</button>':v.source}</b></div></div><div class="remark"><label for="remark">存档备注</label><div class="actions"><input id="remark" maxlength="40" value="${esc(v.title)}" aria-label="存档备注">${button('保存备注','remark')}</div></div>${statusBox()}<div class="actions">${button('恢复到本地','restore','primary',state.busy)}${button('存档目录','directory','secondary')}</div><p class="muted" style="font-size:11px">恢复将修改本地文件，先检查环境并创建安全备份。</p></div></div>`}
function market(){if(state.view)return marketDetail();return heading('存档广场',selectedGame().name+' / 仅展示脱敏示例',button('发布存档','publish','secondary'))+`<div class="subtabs">${['热门','最新','我的发布'].map(t=>`<button data-tab="${t}" class="${state.tab===t?'active':''}">${t}</button>`).join('')}</div>${state.tab==='我的发布'?`<div class="row"><div><b>${state.published?esc(state.draft.title):'暂无发布内容'}</b><p>${state.published?'模拟审核中 · 不会提交到线上':'选择云端版本，发布你的玩法进度。'}</p></div>${button('编辑发布','publish','secondary')}</div>`:`<div class="actions" style="margin-bottom:18px"><span class="tag">全部</span><span class="tag">优质开局</span><span class="tag">通关进度</span><span class="tag">专辑</span></div><div class="grid">${[{id:'m1',title:'神级开局 · 资源丰富',tag:'优质开局',img:selectedGame().img},{id:'m2',title:'通关存档 · 全章节',tag:'通关进度',img:'wukong'},{id:'album',title:'精选开局合集',tag:'专辑 · 3份存档',img:'elden'},{id:'invalid',title:'历史分享 · 已下架',tag:'内容失效',img:'monster'}].map(c=>`<button class="card" data-market="${c.id}"><img src="${embeddedAssets[c.img]}" alt="示意封面"><div class="card-body"><strong>${c.title}</strong><span class="tag">${c.tag}</span><p>${selectedGame().platform} · 版本要求以适配检测为准</p><small>演示作者 · ${c.id==='invalid'?'已停止应用':'查看详情 →'}</small></div></button>`).join('')}</div><p class="muted" style="font-size:11px;margin-top:20px">内容为虚构演示，封面不代表游戏实际存档；不承诺任何游戏已适配。</p>`}`}

function preflight(){if(state.busy){toast('当前有写操作进行中，请稍候');return false}if(state.scenario==='account'){state.result={error:true,title:'账号不匹配，操作已停止',body:'核对绑定关系后再继续，不会自动重新绑定。'};render();return false}if(state.scenario==='running'){state.result={error:true,title:'请先退出游戏',body:'保留当前选中版本，退出后重新检测。'};render();return false}return true}
function requestRestore(origin='history',safeIndex=null){if(!preflight())return;const target=origin==='history'?version().title:origin==='safe'?'恢复前安全备份':'广场共享进度';modal('恢复到本地 · 安全确认',`<p>将用以下存档替换当前游戏本地进度。</p><div class="row"><div><b>${esc(target)}</b><p>${selectedGame().name} · Steam DEMO-${state.account}</p><small>D:/Games/Demo/Saves（模拟路径）</small></div></div><p>先创建并校验操作前备份。备份失败立即停止覆盖。文件写入完成后仍需进入游戏验证读取。</p><p class="muted">本次演示不触碰任何真实文件。</p>`,button('取消','cancel','secondary')+button('确认并先备份','confirm-restore','primary'));state.restoreTarget=target}
async function job(kind){if(!preflight())return;if(kind==='backup'&&(state.scenario==='empty'||state.gameOff)){state.result={error:true,title:state.gameOff?'当前游戏备份未开启':'未检测到本地存档',body:'请先完成游戏存档与路径检测，再开始备份。'};render();return}const g=selectedGame(),k=key(),sc=state.scenario;state.busy=true;state.result=null;const task={id:'DEMO-'+Date.now().toString().slice(-7),kind,title:kind==='backup'?'备份存档':'恢复存档',game:g.name,gameId:state.game,account:state.account,phase:'准备中',status:'进行中'};state.tasks.unshift(task);const steps=kind==='backup'?['扫描文件','打包存档','上传存档','校验云端副本']:['创建安全备份','校验安全备份','写入所选版本','校验恢复结果'];let failed=false;for(let i=0;i<steps.length;i++){state.phase=task.phase=steps[i];state.progress=(i+1)*25;render();await new Promise(r=>setTimeout(r,650));if(kind==='backup'&&sc==='network'&&i===2){state.result={error:true,title:'备份失败 · 网络中断',body:'演示服务确认未提交新版本。本地和原云端版本未修改，可重试。'};failed=true;break}if(kind==='restore'&&sc==='safety'&&i===1){state.result={error:true,title:'安全备份校验失败，已停止',body:'没有执行写入，本地存档保持不变。请检查空间与权限。'};failed=true;break}if(kind==='restore'&&i===1)state.safe.unshift({key:k,time:new Date().toLocaleString('zh-CN'),task:task.id});if(kind==='restore'&&sc==='rollback'&&i===2){task.phase='恢复失败 → 回滚未完成';state.result={error:true,title:'回滚未完成 · 请勿继续游戏',body:'停止后续写操作，保留保护副本。请通过诊断反馈求助；不能显示“恢复成功”。'};failed=true;break}}
if(!failed){if(kind==='backup'){const vs=state.versions[k];vs.unshift({id:'v'+Date.now(),title:'手动备份 · '+new Date().toLocaleTimeString('zh-CN'),time:'2026-10-26 '+new Date().toLocaleTimeString('zh-CN'),device:'DESKTOP-DEMO',size:'8.30 MB',source:'本地备份',locked:false});while(vs.filter(v=>!v.locked).length>10)vs.splice(vs.findLastIndex(v=>!v.locked),1);state.selected=vs[0].id}state.result={title:kind==='backup'?'备份已完成':'文件已恢复 · 游戏读取待验证',body:kind==='backup'?'已校验并新增云端版本。':'已完成文件写入校验。请启动游戏检查是否正确读取，不能将此结果等同于游戏内进度验证通过。'};task.status='已完成';task.phase=kind==='backup'?'云端校验成功':'文件校验成功 · 游戏读取待验证'}else{task.error=true;task.status='失败';task.detail=state.result.body}state.busy=false;render()}

lue.includes('\\')?'<div class="status-box">示例范围：progress.sav · profile.dat<br>过滤规则仅作演示；不扫描磁盘。</div>':''},feedback:()=>{if(!$('#feedback').value.trim()){$('#feedback-result').textContent='请填写问题说明';return}state.feedbackDevice=$('#device').value;state.authorized=$('#logs').checked;$('#feedback-result').textContent='演示反馈 DEMO-FB-001 · 已记录故障设备：'+state.feedbackDevice+'；'+(state.authorized?'已勾选脱敏日志授权（未读取或上传）':'未授权日志')},'submit-publish':()=>{if(!state.draft.title.trim()||!state.draft.description.trim()){$('#publish-error').textContent='请填写标题与介绍，原内容已保留';return}state.published=true;state.nav='market';state.view=null;state.tab='我的发布';toast('模拟提交审核，未上传线上')},'confirm-delete':()=>{state.saved=state.saved.filter(s=>s.id!==state.deleteId);closeModal();toast('已删除演示引用，本地未修改')}};
document.addEventListener('click',e=>{const retry=e.target.closest('[data-retry]');if(retry){const t=state.tasks.find(t=>t.id===retry.dataset.retry);if(t.account!==state.account){toast('请先切换至原任务账号，再重试');return}state.game=t.gameId;state.nav='cloud';render();if(t.kind==='backup')job('backup');else requestRestore();return}const nav=e.target.closest('[data-nav]');if(nav){state.nav=nav.dataset.nav;state.view=null;state.result=null;if(state.nav==='market')state.tab='热门';render();return}const game=e.target.closest('[data-game]');if(game){if(state.busy){toast('当前写操作中，可切换页面但暂不切换游戏');return}state.game=game.dataset.game;state.selected='v1';state.result=null;state.view=null;render();return}const lock=e.target.closest('[data-lock]');if(lock){if(state.busy){toast('任务中暂不能修改版本');return}const v=versions().find(v=>v.id===lock.dataset.lock);if(!v.locked&&versions().filter(v=>v.locked).length>=5){toast('锁定已达5个独立名额，请先解除其他锁定');return}v.locked=!v.locked;toast(v.locked?'已锁定，不参与普通轮转':'已解除锁定');render();return}const ver=e.target.closest('[data-version]');if(ver){state.selected=ver.dataset.version;render();return}const m=e.target.closest('[data-market]');if(m){state.view=m.dataset.market;render();return}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}const apply=e.target.closest('[data-apply]');if(apply){if(state.busy){toast('请等待当前任务结束再应用');return}const s=state.saved.find(s=>s.id===apply.dataset.apply);state.game=s.game;requestRestore('market');return}const del=e.target.closest('[data-remove]');if(del){state.deleteId=del.dataset.remove;modal('删除保存记录','<p>只移除“我的存档”中的演示引用，不删除本地游戏进度、历史版本或安全备份。</p>',button('取消','cancel','secondary')+button('删除记录','confirm-delete','danger'));return}const sf=e.target.closest('[data-safe]');if(sf){requestRestore('safe',sf.dataset.safe);return}const tg=e.target.closest('[data-tag]');if(tg){const t=tg.dataset.tag;if(state.draft.tags.includes(t))state.draft.tags=state.draft.tags.filter(x=>x!==t);else if(state.draft.tags.length<3)state.draft.tags.push(t);else{toast('最多选择3个标签');return}render();return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a.startsWith('save-album-')){saveItem('专辑 · '+(a.endsWith('0')?'资源开局':'海岸开局'),'中转站');return}if(actions[a]){actions[a]();if(!['restore','conflict','confirm-restore','conflict-restore','keep-both','backup','test-path','feedback','submit-publish','cache-path'].includes(a))render();if(a==='submit-publish'&&state.published)render();}}});

const req={welcome:['01','首次使用','F01 / F03','第一步不是上传，而是解释保护范围。','让用户先理解：雷神账号管理云空间；Steam 官方身份与本地档案是两件事。不要向用户收集 Steam 密码或验证码。','客户端只扫描已适配目录；服务端控制云数据权限。此演示从未登录开始，不访问真实文件。','不要在未检测、未成功备份前显示“已受到保护”。普通备份不强制 Steam 绑定为待确认建议。'],login:['02','登录雷神','F01','云空间归谁，必须先明确。','模拟登录后展示雷神体验账号；产品正式版复用加速器已有登录态，避免重复登录。会话失效保留未完成页面，不清空已有云数据。','服务端验证雷神会话，按用户授权返回档案与版本；不信任客户端传入的用户 ID。真实登录、二维码与验证码均为后端依赖。','切换雷神用户需重新查询其云空间。演示只有一个雷神账号和两个本地档案，不代表生产已允许任意关联。'],add:['03','添加与扫描游戏','F03 / F05','发现已安装，不等于已经找到可用存档。','扫描结果先列出支持游戏；选中后进入档案与目录检测。未适配、未安装、未产生存档要分别提示。不得将截图中的在线竞技游戏直接承诺为可备份。','客户端结合安装记录、完整进程路径与服务端适配规则；新增规则必须有适配测试。不自动遍历所有磁盘上传。','游戏可浏览而不强制 Steam 官方绑定。本页扫描为模拟；清晰标记未适配项，新增游戏不自动执行首次上传。'],setup:['04','确认档案与路径','F02 / F04 / F05','网页验证的 Steam，与本地存档真是同一个账号吗？','默认选择本次已确认的档案；多个候选时用户选择。可选官方身份验证，不把本地检测标为“已验证”。路径与文件范围展示在同一页，不串联弹窗。','正式验证跳系统浏览器，服务端校验 OpenID。Windows 已知目录 API 解析重定向文件夹；AccountID 与 SteamID64 不能混用。ID/路径全是演示值。','改路径或切换档案使检测失效；无文件、无权限分别修复。若已有云版本视为“新设备接入”先比较，不当作首次上传。'],backup:['05','首次备份','F06','只有第一份有效版本提交后，保护才真正生效。','首次点击“开启并备份”，呈现扫描、打包、传输、校验。成功反馈在页面内展示，不加成功弹窗。网络失败保留配置与重试入口。','快照与清单 hash 确保一致；服务端校验后提交有效版本。任务幂等 ID 避免重试重复计数。真正的增量上传不能损害完整可恢复性。','首次失败仍是首次备份；不消耗版本名额、不置为保护成功。首次与后续使用同一校验标准。未检测路径不能绕过。'],home:['06','云存档首页','F03 / F06 / F07','每张卡片，直接告诉用户现在能不能放心。','按参考图使用游戏网格：图标、游戏、最近成功时间和状态；右上角历史、目录常驻。错误仅影响相关卡片，不用全局弹窗打断所有游戏。','卡片状态来自账号×游戏档案对应任务；列表失败在列表重试。退出后事件由后台服务监听，完全退出加速器时不能保证实时备份。','空列表提供添加入口。手动备份与退出后自动备份属于触发方式，不分“普通/非普通”。目录按钮仅模拟说明，不打开系统。'],detail:['07','历史版本与后续备份','F07 / F08 / F09','版本基准必须属于当前账号档案。','点击历史查看版本、备注、锁定。手动备份、自动备份复用已确认目录，每次重查环境。有变化才创建版本；首次备份与新设备接入不能混为一谈。','云版本按雷神用户×平台×游戏×档案隔离；后续更新需比较基准，不能只看本地修改时间。普通10、锁定独立5为待确认演示规则。','恢复前检测账号、路径、游戏运行与兼容性；一次安全确认。文件写入成功仅标记“游戏读取待验证”。安全备份失败不允许覆盖。'],auto:['07A','退出后自动备份','F07 / F10','自动备份要等待退出和文件稳定，而不是盲目定时上传。','单游戏开关由用户选择。模拟有变化/无变化/仍在运行的退出事件；无变化不新增版本，关闭开关后不产生任务。','正式客户端按适配进程路径监听，并对比内容清单。后台服务是否随主界面关闭继续运行需明示；离线排队，下次启动补检。','账号或路径变化暂停，不自动复用旧档案。演示不检测电脑进程；不能把此开关宣称为已实现真实后台保护。'],restore:['08','覆盖确认与安全恢复','F08 / F09','恢复是否会动本地？出错后怎么留住原进度？','选中版本后一次确认：目标游戏、档案、路径、来源都明确。先备份并校验当前本地，再下载/校验目标并写入。','客户端需要临时区和事务日志；多文件操作不天然原子。服务端再次核验版本权限。安全备份关联任务和档案，不作为可随手删除的缓存。','游戏运行、无原存档未适配、账号错配应就地阻断。失败尝试回滚，回滚失败保留副本与求助入口；不要误报成功。'],conflict:['08A','冲突比较','F10','时间较新，不一定是正确进度。','持续提示先告知冲突，用户主动比较后决策。保留双方快照；恢复云端时本次选择即覆盖确认，不再重复弹窗。','正式产品固定本地/云端两份快照、检查配额和版本并发；另一设备更新时重新比较。Steam Cloud 竞争需游戏级适配。','不做自动存档合并；保留两份成功前不消除冲突。示例时间、体积是模拟内容，不是实际游戏解析。'],market:['09','存档广场','F18–F22','保存，是收藏；应用，才修改本地。','保留旧 Demo 的分类、内容、专辑、发布入口。广场有游戏侧栏，和云存档卡片页不同；失效内容展示原因并禁用应用。','后台包清单、ZIP 解压边界、大小数量限制与兼容信息审核。本 Demo 素材仅示意，不宣称这些游戏或作者存档已通过适配。','保存只创建当前用户引用；应用复用目标档案检查和恢复保护。未配置本地目标时先引导检测，不直接写入。'],saved:['10','我的存档','F23 / F24','移除引用，不等于删掉本地游戏进度。','收藏夹与中转站分开；保存后仍需主动应用。无记录为空态，不生成假收藏；删除只作用本演示引用。','服务端按雷神账号权限读取；缓存、唯一中转副本、用户收藏生命周期须分开定义。引用失效也保留可追溯原因。','应用按钮先检查当前游戏档案和目录。不可逆删除才需确认；这里不会删真实文件。'],tasks:['11','任务与结果','F10 / F29','失败的阶段、影响范围和下一步要说清。','任务按阶段查看、失败可重试。写入成功显示读取待验证；回滚未完成持续告警。用户可以导航，但任务中不能切换写入目标。','生产任务状态持久保存在服务端/客户端队列，使用幂等 ID。演示任务当前会话有效，刷新重新体验，不承诺真实数据留存。','不能把账号问题报成登录超时。重试重新检查原档案权限与目录；回滚失败时不鼓励盲目重复恢复。'],settings:['12','设置与关联','F02 / F25–F28','解绑、切档案和清缓存，影响完全不同。','当前雷神用户、Steam官方验证、本地档案分开展示。解绑不删云数据；切换档案重载对应历史。自动开关只改偏好。','缓存路径变更仅针对可重下临时文件；正式迁移先测可写、复制校验后切换，失败不删源。不得清理安全备份或唯一副本。','当前两档案切换与缓存是模拟。绑定数量、迁移权限和配额口径仍待确认；版本历史不能跨档案复用。'],addpath:['03','添加与路径','F03 / F05','先定义支持范围，再允许操作。','首次使用在引导页检测目录，日常可在这里添加其他游戏。未适配入口禁用并解释原因。','新增游戏规则来自审核过的配置版本；测试不能只检查字符串是否有斜线，需客户端做真实文件权限与范围检测。','浏览器不扫描磁盘。路径演示不会作为真实适配成功依据。'],publish:['13','发布存档','F21','发出去的是什么？是否经过内容审核？','选择本游戏版本，填写标题、说明、图片与至多3个标签。提交只展示模拟待审核，不假装已经上线。','生产需要包校验、图片上传、审核、下架和版权/隐私检查；账号凭据和包含个人信息的文件不应混入包。','任务进行中禁止切换目标；失效版本不可发布。示例仅模拟信息表单。'],safe:['14','恢复前安全备份','F14 / F09','保护副本必须关联到具体的恢复任务。','显示创建时间、校验和关联任务；还原安全副本也要前置检查和一次覆盖确认。','安全备份按当前档案隔离，留存规则与空间策略待定；迁移和清缓存不能删除唯一有效副本。','回滚未完成时保留副本，不标为普通临时文件。Demo 不保证真实磁盘上存在该副本。'],diagnostics:['15','诊断与反馈','F29–F31','客服需要错误信息，不是用户密码。','选择发生故障的设备、问题类别，日志默认不授权；填写说明后模拟生成反馈编号。','生产日志最小化、脱敏、告知留存与授权范围；不包含 Steam 密码、验证码、cookie 或用户无关文件。','本 Demo 不读取或上传日志；真实处理进度要靠工单系统接入。']};
let activeNote='welcome';function annotate(id){activeNote=id;const n=req[id]||req.home;$('#annotation').innerHTML=`<div class="notehead"><b>交互批注　${n[0]} / ${n[2]}</b><h2>${n[1]}</h2><small>随当前环节变化 · 不属于正式用户界面</small></div>${['本环节考虑什么','产品应该怎么做','加速器 / 服务端职责','异常、安全与待确认'].map((t,i)=>`<div class="notecard"><label>${t}</label><p>${n[i+3]}</p></div>`).join('')}<div class="notecard"><label>你的评审意见</label><textarea id="comment" placeholder="在这里批注此环节…">${esc(reviewComments[id]||'')}</textarea><small id="comment-save">仅当前浏览器保存，可导出交接</small></div>`;$('#comment').oninput=e=>{reviewComments[id]=e.target.value;try{localStorage.setItem('leigod-white-yellow-comments-v1',JSON.stringify(reviewComments));$('#comment-save').textContent='已保存到当前浏览器'}catch{$('#comment-save').textContent='本地存储不可用，请立即导出'}}}
function jump(nav){state.nav=nav;state.result=null;state.view=null;render()}
function setGame(id,nav='setup'){if(state.busy){toast('任务中不能切换目标游戏');return}state.game=id;state.selected=versions()[0]?.id||'';state.result=null;state.nav=nav;render()}
function welcome(){return `<div class="welcome"><div class="welcometop"><span class="stepnum">GET STARTED / 第一步</span><span class="tag">本地模拟体验</span></div><h1>把游戏进度，<br><em>稳稳留在云端。</em></h1><p class="lead">换电脑、重装系统，或者想回到之前的某一刻。<br>从一次清晰的确认开始，让后续备份更省心。</p><div class="illustration"><div class="symbol">▤</div><div class="flowline">··· →</div><div class="symbol">☁</div><div class="flowline">→ ···</div><div class="symbol">↶</div></div><div class="welcome-cards"><div><b>01　确认备份范围</b><p>识别游戏、档案和存档目录</p></div><div><b>02　第一次备份</b><p>校验成功，才算开启保护</p></div><div><b>03　后续自动保护</b><p>退出后备份，恢复前留退路</p></div></div><div class="actions">${button('开始体验 →','login','primary')}${button('浏览支持游戏','browse','secondary')}</div><p class="homehint">不需要真实账号密码。不读取、上传或覆盖你的电脑文件。</p></div>`}
function login(){return `<div class="welcome">${heading('登录雷神账号','第一步 / 云存档保存在你的雷神云空间')}<div class="panelnew"><span class="stepnum">01 / LEIGOD ACCOUNT</span><h3>复用加速器登录，不再重复注册</h3><p class="muted">正式产品使用加速器已有登录态。这里使用体验账号演示，不收集手机号、密码或验证码。</p><div class="row"><div class="avatar">L</div><div><b>雷神体验账号</b><p>独立云空间 · 模拟用户</p></div></div>${button('使用体验账号登录','login-done','primary')}<p class="homehint">Steam 身份可按需要单独验证，不是登录雷神的替代方式。</p></div>${button('← 返回','welcome','secondary')}</div>`}
function scan(){const done=!!flow.scanned;return heading(flow.added.length?'添加游戏':'添加你的第一个游戏','扫描支持列表 → 选择游戏 → 确认档案与路径',button('← 云存档','cloud','secondary'))+`<div class="panelnew"><div class="actions" style="justify-content:space-between"><div><h3>本机游戏扫描</h3><small>只演示已适配游戏的发现结果，不遍历真实磁盘</small></div>${button(done?'重新扫描':'扫描支持游戏','scan','primary',state.busy)}</div>${done?`<div style="margin-top:20px">${games.map(g=>`<button class="selectgame" data-setup="${g.id}"><img src="${image(g)}" alt=""><div><strong>${g.name}</strong><small>Steam · 模拟安装记录 · ${flow.added.includes(g.id)?'已添加，可重新检测':'可配置存档'}</small></div><span>选择 →</span></button>`).join('')}<div class="row"><div><b>未验证游戏平台 / 竞技游戏</b><p>不因参考图展示了图标就承诺支持</p></div><button disabled>待专项适配</button></div></div>`:'<div class="empty"><h2>先找到你想保护的游戏</h2><p>点击扫描，查看模拟游戏列表。</p></div>'}</div>`}
function setup(){const g=selectedGame(),c=cfg();return heading(g.name,'确认对象 / 账号档案与实际文件范围',button('← 返回列表','cloud','secondary'))+`<div class="panelnew"><span class="stepnum">02 / LOCAL PROFILE</span><h3>本地存档档案</h3><div class="pair">${['A','B'].map(a=>`<label class="labelrow"><input type="radio" name="localprofile" value="${a}" ${state.account===a?'checked':''} ${state.busy?'disabled':''}> 本地档案 ${a}<small style="display:block;margin:5px 0 0 23px">本地检测 · 不作为官方认证</small></label>`).join('')}</div><div class="actions" style="margin-top:10px"><span class="pill">${flow.auth?'Steam '+flow.authID+' · 官方验证（模拟）':'Steam 官方身份未验证'}</span>${button('可选：模拟 Steam 官方验证','verify','secondary',state.busy)}</div>${flow.auth&&flow.authID!==state.account?'<div class="status-box error">验证账号与本地档案不同，请切换档案或重新验证；不会自动关联。</div>':''}</div><div class="panelnew"><span class="stepnum">03 / SAVE DIRECTORY</span><h3>存档目录与范围</h3><div class="field"><label for="setup-path">实际路径（示例）</label><input id="setup-path" value="${esc(c.path)}" ${state.busy?'disabled':''}></div><div class="field"><label for="setup-env">模拟检测环境</label><select id="setup-env" ${state.busy?'disabled':''}><option value="normal">正常，有存档文件</option><option value="empty">尚未生成存档</option><option value="denied">没有目录读取权限</option></select></div><div class="actions">${button('检测目录与文件','check-directory','secondary',state.busy)}<span id="setup-status" class="inlinehint">${c.tested?'已检测 · 示例文件可读取':'修改路径后需重新检测'}</span></div><div id="setup-preview" class="filepath">${c.tested?'示例：progress.sav / profile.dat · 合计 8.30 MB · 不含日志及临时文件':''}</div></div><div class="backs">${button('返回游戏扫描','add','secondary')}${button(versions().length?'确认目录，查看已有云版本':'确认范围，进入首次备份','setup-done','primary',!c.tested||state.busy||(flow.auth&&flow.authID!==state.account))}</div>`}
function first(){const c=cfg();return heading('开启第一次备份',selectedGame().name+' / 本地档案 '+state.account,button('← 检查配置','setup','secondary'))+`<div class="panelnew"><span class="stepnum">04 / FIRST BACKUP</span><h3>请确认这次保护的内容</h3><div class="row"><div><b>${selectedGame().name} · Steam · 档案 ${state.account}</b><p class="filepath">${esc(c.path)}</p></div><img src="${image(selectedGame())}" alt="" style="width:58px;height:58px;border-radius:8px;object-fit:cover"></div><p class="filepath">progress.sav / profile.dat · 8.30 MB · 示例范围</p><label class="labelrow"><input id="first-auto" type="checkbox" ${c.auto?'checked':''}> 首次成功后，开启游戏退出自动备份</label><small>自动备份是开关；“保护已开启”只有在有效版本提交后才显示。</small></div>${statusBox()}<div class="actions">${button(state.result?.error?'重试首次备份':'开启并备份','backup','primary',state.busy)}${button('查看任务','tasks','secondary')}</div>${c.enabled?`<div class="featurelinks">${button('查看云存档首页 →','cloud')}${button('查看历史，体验恢复 →','detail')}</div>`:''}`}
function home(){if(!flow.logged)return welcome();const all=flow.added.map(id=>games.find(g=>g.id===id)).filter(Boolean).filter(g=>g.name.toLowerCase().includes(state.search.toLowerCase()));const protectedCount=flow.added.filter(id=>flow.config[state.account+':'+id]?.enabled).length;return `<div class="summaryrow"><span>雷神云空间</span><strong>${flow.added.length}</strong><span>款游戏</span><span>·</span><span>${protectedCount} 款已完成首次备份</span><div class="spacer"></div>${button('选择档案 '+state.account,'profiles','linkbtn')}${button('任务中心','tasks','linkbtn')}</div>${!flow.added.length?`<div class="empty"><h2>还没有添加游戏</h2><p>从第一款游戏开始，确认档案和目录后再开启备份。</p>${button('＋ 添加游戏','add','primary')}</div>`:!all.length?'<div class="empty"><h2>没有匹配游戏</h2><p>试试其他名称；清空顶部搜索恢复全部卡片。</p></div>':`<div class="homegrid">${all.map(g=>{const c=flow.config[state.account+':'+g.id]||{};const task=state.tasks.find(t=>t.gameId===g.id&&t.account===state.account),err=task?.error;return `<article class="tile"><div class="tiletools"><button data-history="${g.id}" aria-label="${g.name}历史版本" title="历史版本">${icons.clock}</button><button data-directory="${g.id}" aria-label="${g.name}存档目录" title="存档目录">${icons.folder}</button></div><img src="${image(g)}" alt="${g.name}示意图"><h3>${g.name}</h3><div class="time">${esc(c.last||'尚未创建有效云版本')}</div><div class="state ${err?'bad':c.enabled?'good':''}">${task?.status==='进行中'?'◌ '+task.phase:err?'! '+task.title+'失败，可重试':c.enabled?'✓ 最近备份已校验':c.ready?'○ 已检测，尚未开启备份':'! 需要确认本地档案与路径'}</div><button class="tileaction" data-setup="${g.id}">${c.enabled?'管理备份 →':c.ready?'开启首次备份 →':'检测与开启 →'}</button></article>`}).join('')}<button class="tile addtile" data-action="add"><span>＋</span>添加游戏<small>扫描已适配游戏</small></button></div>`}<p class="homehint">参考布局：卡片右上角查看历史、打开目录。素材仅示意，实际支持以适配配置为准。</p><div class="featurelinks">${button('我的存档','saved')}${button('诊断与反馈','diagnostics')}${button('浏览存档广场','market')}</div>`}

sidebar=()=>{$('#sidebar').innerHTML=`<div class="account"><div class="avatar">${state.account}</div><div><strong>${flow.logged?'雷神体验账号':'未登录'}</strong><small>本地档案 ${state.account} · 模拟环境</small></div></div><div class="games">${games.map(g=>`<button class="game ${g.id===state.game?'selected':''}" data-pick="${g.id}"><img src="${image(g)}" alt=""><div class="game-info"><strong>${g.name}</strong><small>${g.platform} · 示例适配</small></div></button>`).join('')}</div><div class="aside-bottom">${button('我的存档','saved')}${button('我的发布','my-publish')}</div>`};
let rendering=false;render=()=>{if(rendering)return;rendering=true;try{oldRender();if(!flow.logged&&!['welcome','login','add'].includes(state.nav)){state.nav='welcome'}let fn={welcome,login,cloud:home,add:scan,setup,first,detail,settings};if(fn[state.nav])$('#content').innerHTML=fn[state.nav]();$('#sidebar').style.display=state.nav==='market'||state.nav==='publish'||state.nav==='saved'?'flex':'none';document.querySelectorAll('nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['market','saved','publish'].includes(state.nav)?'market':'cloud')));$('#login-name').textContent=flow.logged?'体验账号':'登录';$('#global-search').value=state.search;$('#task-count').textContent=state.tasks.filter(t=>t.account===state.account).length;const c=cfg(),step=!flow.logged?0:!flow.added.length?1:!c.ready?2:!c.enabled?3:4;$('#journey').innerHTML=['登录雷神','添加游戏','确认档案与路径','首次备份','日常备份与恢复'].map((t,i)=>`<span class="${i<step?'done':i===step?'current':''}"><i>${i<step?'✓':i+1}</i>${t}</span>`).join('<span>›</span>');$('#annotation').style.display=flow.notes?'':'none';$('.workspace').classList.toggle('closed',!flow.notes);$('#notes-toggle').textContent=flow.notes?'收起批注':'展开批注';$('#review-panel').style.display=flow.notes?'block':'none';$('#interaction-note').textContent='场景只影响当前演示目标。先走正常链路，再在历史恢复或备份前切换异常。';const n=state.nav==='cloud'&&!flow.logged?'welcome':state.nav==='first'?'backup':state.nav==='market'?'market':state.nav;annotate(n);if(state.busy){document.querySelectorAll('[data-pick],[data-history],[data-directory],[data-setup]').forEach(b=>b.disabled=true)}bindFlow();}finally{rendering=false}};
function requireLogin(){if(flow.logged)return true;state.nav='login';render();toast('先登录雷神体验账号；不会要求 Steam 密码');return false}
preflight=()=>{if(!requireLogin())return false;if(state.busy){toast('当前任务进行中，请稍候');return false}if(flow.blocked){state.result={error:true,title:'回滚未完成 · 暂停写操作',body:'请先通过诊断确认恢复，勿反复写入扩大损失。此演示需重新体验后才能清除此阻断。'};render();return false}if(flow.auth&&flow.authID!==state.account){state.result={error:true,title:'账号档案不匹配',body:'官方验证身份与本地候选不同；请重新验证或选择正确档案。'};render();return false}if(!cfg().ready){state.nav='setup';render();toast('先确认目标档案、路径和文件范围');return false}return oldPreflight()};
requestRestore=(origin='history',idx=null)=>{if(!preflight())return;if(state.scenario==='empty'){state.result={error:true,title:'未检测到本地存档',body:'本示例未适配首次恢复，请先启动游戏产生存档再检测。'};render();return}if(origin==='history'&&!versions().length){toast('当前档案还没有有效云版本');return}oldRestore(origin,idx);$('.modal small')&&($('.modal small').textContent=cfg().path+'（模拟路径）');annotate('restore')};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
job=async kind=>{if(!preflight())return;const c=cfg();if((kind==='backup'||kind==='restore')&&state.scenario==='empty'){state.result={error:true,title:'未产生本地存档',body:'先启动游戏保存一次，本次不上传或覆盖。'};render();return}const sc=state.scenario,k=key(),g=selectedGame(),target=state.restoreTarget||version().title;const firstTime=!versions().length;state.busy=true;state.result=null;const task={id:'DEMO-'+Date.now(),kind,title:kind==='backup'?(firstTime?'首次备份':'后续备份'):'恢复：'+target,game:g.name,gameId:g.id,account:state.account,phase:'准备中',status:'进行中'};state.tasks.unshift(task);const steps=kind==='backup'?['扫描并等待文件稳定','打包一致性快照','上传存档','校验并提交有效版本']:['创建恢复前安全备份','校验安全备份','写入所选版本','校验写入结果'];let fail=false;for(let i=0;i<4;i++){state.phase=task.phase=steps[i];state.progress=(i+1)*25;render();await wait(460);if(kind==='backup'&&sc==='network'&&i===2){state.result={error:true,title:'备份失败 · 网络中断',body:'未提交有效版本，原本地与云端不变。可以重新选择正常环境后重试。'};fail=true;break}if(kind==='restore'&&sc==='safety'&&i===1){state.result={error:true,title:'安全备份校验失败 · 已停止',body:'没有执行写入，原本地存档未修改。'};fail=true;break}if(kind==='restore'&&i===1)state.safe.unshift({key:k,time:isoNow(),task:task.id});if(kind==='restore'&&sc==='rollback'&&i===2){state.result={error:true,title:'回滚未完成 · 请勿继续游戏',body:'恢复失败且回滚未完成。保护副本保留，暂停后续写入；请通过诊断求助。'};flow.blocked=true;fail=true;break}}
if(!fail){if(kind==='backup'){const vs=versions();vs.unshift({id:'v'+Date.now(),title:(firstTime?'首次备份':'手动 / 自动备份')+' · '+new Date().toLocaleTimeString('zh-CN'),time:isoNow(),device:'DESKTOP-DEMO',size:'8.30 MB',source:'本地备份',locked:false});while(vs.filter(v=>!v.locked).length>10)vs.splice(vs.findLastIndex(v=>!v.locked),1);state.selected=vs[0].id;c.enabled=true;c.last=isoNow();flow.autoChanged=false;state.result={title:'备份已完成',body:'云端校验通过 · '+(firstTime?'首份有效版本已建立，保护已开启。':'已保存新版本。')+' 原本地未修改。'};if(!flow.added.includes(g.id))flow.added.push(g.id)}else{flow.readState[k]='pending';state.result={title:'文件已恢复 · 游戏读取待验证',body:'已完成模拟写入校验，请在游戏内检查进度。'};}task.status=kind==='restore'?'读取待验证':'已完成';task.phase=kind==='backup'?'云端校验成功':'写入完成，游戏读取待验证';}else{task.status='失败';task.error=true;task.detail=state.result.body}state.busy=false;render();};

function cleanProduct(root){const replacements=[[/本地档案 [AB]/g,'本机存档'],[/档案 [AB]/g,'本机存档'],[/账号[AB]/g,'雷神玩家'],[/DEMO-[AB]/g,'雷神玩家'],[/体验账号/g,'雷神玩家'],[/模拟安装记录/g,'已发现游戏'],[/示例范围/g,'备份范围'],[/示例目录/g,'存档目录'],[/示例文件/g,'存档文件'],[/示例路径/g,'演示路径'],[/DEMO-/g,'CS-'],[/DESKTOP-DEMO/g,'我的电脑'],[/LAPTOP-DEMO/g,'笔记本电脑'],[/模拟提交审核，未上传线上/g,'已提交审核（演示）'],[/演示反馈/g,'反馈记录'],[/已模拟清理/g,'已清理'],[/已模拟/g,'已'],[/模拟读取/g,'读取'],[/模拟写入/g,'写入'],[/模拟校验/g,'校验'],[/模拟保存/g,'保存'],[/已删除演示引用/g,'已删除保存记录']];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(['SCRIPT','STYLE'].includes(n.parentElement.tagName))continue;let text=n.nodeValue;for(const [a,b] of replacements)text=text.replace(a,b);if(text!==n.nodeValue)n.nodeValue=text}}
render=()=>{flow.notes=false;state.notes=false;productRender();document.body.classList.toggle('simple-home',['cloud','welcome'].includes(state.nav));$('#annotation').style.display='none';$('#review-panel').style.display='none';$('.review').style.display='none';$('.workspace').classList.add('closed');$('#login-name').textContent=flow.logged?'雷神玩家':'登录';$('#login-name').title='账号与设置';$('#journey').style.display='none';if(state.nav==='cloud'&&flow.logged)document.querySelector('.summaryrow [data-action=profiles]')?.remove();if(state.nav==='detail'&&!state.busy&&flow.readState[key()]==='pending')$('#content').insertAdjacentHTML('beforeend','<div class="panelnew"><h3>检查游戏进度</h3><p>文件恢复完成后，请在游戏中确认进度是否正常。</p><div class="actions">'+button('进度正常','read-ok','primary')+button('遇到读取问题','product-read-failed','secondary')+'</div></div>');if(state.nav==='detail'&&!state.busy&&!state.result){const t=$('#content .pagehead p');if(t)t.textContent='历史版本 · 备份与恢复'}document.querySelector('#global-auto')?.addEventListener('change',e=>{flow.globalAuto=e.target.checked;persist()});document.querySelectorAll('[data-auto-game]').forEach(i=>i.onchange=()=>{flow.config['A:'+i.dataset.autoGame].auto=i.checked;persist()});document.querySelectorAll('#auto-flow,#first-auto').forEach(i=>i.addEventListener('change',persist));cleanProduct($('#content'));persist()};
